server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El backend limita el JSON a 100kb; dejamos algo de margen.
    client_max_body_size 1m;

    # Proxy de la API hacia el contenedor del backend (red interna de Compose).
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA: rutas desconocidas devuelven index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache larga para los assets con hash de Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
